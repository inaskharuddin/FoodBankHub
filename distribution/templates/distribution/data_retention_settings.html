<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Self-report retention</title></head><body><h1>Self-report data retention</h1><p>Old self-reports, their actual-demand history and allowance usage are removed by the scheduled cleanup.</p><form method="post">{% csrf_token %}<label>Keep records for (months) <input type="number" min="1" max="120" name="retention_months" value="{{ policy.retention_months }}" required></label><p><label><input type="checkbox" name="enabled" {% if policy.enabled %}checked{% endif %}> Enable automatic cleanup</label></p><button type="submit">Save</button></form><p><a href="{% url 'admin_dashboard' %}">Admin dashboard</a></p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}</body></html>
