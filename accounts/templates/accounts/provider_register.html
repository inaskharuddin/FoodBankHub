{% load static %}
<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="{% static 'css/provider_portal.css' %}"><title>Register Food Bank</title></head><body class="provider-body auth-page">
<h1>Register a Food Bank</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}
<label>Account name <input name="name" required></label><br>
<label>Email <input type="email" name="email" required></label><br>
<label>Password <input type="password" name="password" required></label><br>
<label>Food bank name <input name="food_bank_name" required></label><br>
<label>Phone <input name="phone" required></label><br>
<label>Address <textarea name="address" required></textarea></label><br>
<label>Self-service hours <input name="operating_hours" placeholder="Mon-Fri 9:00-17:00 or 24/7" required></label><br>
<button type="submit">Create Provider account</button>
</form><p><a href="{% url 'login' %}">Sign in</a></p>
</body></html>
