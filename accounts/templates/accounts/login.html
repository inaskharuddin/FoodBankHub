{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/provider_portal.css' %}">
    <title>FoodBankHub Login</title>
</head>
<body class="provider-body auth-page">

<h1>FoodBankHub Login</h1>

<form method="POST">
    {% csrf_token %}

    <input type="email" name="email" placeholder="Email" required>

    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
</form>
<p>Need food assistance? <a href="{% url 'needy_register' %}">Create a Needy account</a></p>
<p>Register a food bank? <a href="{% url 'provider_register' %}">Create Provider account</a></p>
<p>New donor? <a href="{% url 'donor_register' %}">Create a donor account</a></p>
<p>Supplier? <a href="{% url 'supplier_register' %}">Register your business</a></p>


</body>
</html>
