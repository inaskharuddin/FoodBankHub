<!DOCTYPE html>
<html>
<head>
    <title>Add Inventory</title>
</head>
<body>

<h1>Add Inventory</h1>

<a href="{% url 'inventory_list' %}">
    Back to Inventory
</a>

<hr>

<h3>
    Selected Supplier:
    {{ selected_supplier.supplier.business_name }}
</h3>

<form method="POST">

    {% csrf_token %}

    <label>Product:</label>

    <select name="product" required>

        <option value="">
            Select Product
        </option>

        {% for product in supplier_products %}

            <option value="{{ product.product_id }}">
                {{ product.item.name }}
                - RM {{ product.price }}
                / {{ product.item.unit }}
            </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Current Quantity:</label>

    <input
        type="number"
        name="quantity"
        min="0"
        required
    >

    <br><br>

    <button type="submit">
        Add Inventory
    </button>

</form>

</body>
</html>
