{% extends 'accounts/provider_base.html' %}
{% block title %}Edit Inventory{% endblock %}
{% block content %}
<h1>Edit Inventory</h1>

<a href="{% url 'inventory_list' %}">Back to Inventory</a>

<hr>

<p>
    <strong>Item:</strong>
    {{ inventory.item.name }}
</p>

<p>
    <strong>Unit:</strong>
    {{ inventory.item.unit }}
</p>

{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form method="POST">
    {% csrf_token %}

    <label>Quantity:</label>
    <input
        type="number"
        name="quantity"
        value="{{ inventory.quantity }}"
        min="0"
        required
    >

    <br><br>

    <label>Low stock threshold:</label>
    <input type="number" name="threshold_level" value="{{ inventory.threshold_level }}" min="0" required>
    <br><br><button type="submit">Update Inventory</button>
</form>
{% endblock %}
